<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="620" viewBox="0 0 1680 620" role="img">
<rect width="1680" height="620" fill="#FCFDFE"/>
<text x="40" y="46" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16202A" text-anchor="start" letter-spacing="0.8">HOW A STRANGER VERIFIES A PASSPORT</text><text x="40" y="70" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5C6B7A" text-anchor="start">No wallet. No account. No trust in us. Four checks, any order.</text><rect x="40" y="100" width="385" height="210" rx="8" fill="#FFFFFF" stroke="#E3E9EE"/><rect x="40" y="100" width="385" height="4" rx="2" fill="#7FB79A"/><text x="60" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#16202A" text-anchor="start">1 · Fetch the manifest</text><text x="60" y="160" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3F7A5E" text-anchor="start">0G Storage, by root hash</text><text x="60" y="190" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">The passport page links it. Or find the upload</text><text x="60" y="207" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">on storagescan.0g.ai — we do not serve it.</text><path d="M 436 205 L 428 200 L 428 210 Z" fill="#8A98A6"/><rect x="440" y="100" width="385" height="210" rx="8" fill="#FFFFFF" stroke="#E3E9EE"/><rect x="440" y="100" width="385" height="4" rx="2" fill="#7FB79A"/><text x="460" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#16202A" text-anchor="start">2 · Recompute the hash</text><text x="460" y="160" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3F7A5E" text-anchor="start">sort keys · no whitespace · keccak256</text><text x="460" y="190" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">Canonicalisation is deterministic by design:</text><text x="460" y="207" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">identical content must serialise</text><text x="460" y="224" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">byte-identically.</text><path d="M 836 205 L 828 200 L 828 210 Z" fill="#8A98A6"/><rect x="840" y="100" width="385" height="210" rx="8" fill="#FFFFFF" stroke="#E3E9EE"/><rect x="840" y="100" width="385" height="4" rx="2" fill="#7FB79A"/><text x="860" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#16202A" text-anchor="start">3 · Ask the chain</text><text x="860" y="160" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3F7A5E" text-anchor="start">verifyManifest(tokenId, yourHash)</text><text x="860" y="190" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">Returns true only if your hash equals the one</text><text x="860" y="207" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">anchored at mint. False means it was altered.</text><path d="M 1236 205 L 1228 200 L 1228 210 Z" fill="#8A98A6"/><rect x="1240" y="100" width="385" height="210" rx="8" fill="#FFFFFF" stroke="#E3E9EE"/><rect x="1240" y="100" width="385" height="4" rx="2" fill="#7FB79A"/><text x="1260" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#16202A" text-anchor="start">4 · Check the inputs</text><text x="1260" y="160" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#3F7A5E" text-anchor="start">dataset · base model · TEE signer</text><text x="1260" y="190" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">Retrieve the dataset at its root hash. Compare</text><text x="1260" y="207" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">the base model hash. Read the TEE signer from</text><text x="1260" y="224" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">0G Compute.</text><rect x="40" y="340" width="792.5" height="180" rx="8" fill="#F1F8F4" stroke="#7FB79A"/><text x="62" y="370" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#3F7A5E" text-anchor="start" letter-spacing="1.1">WHAT THIS PROVES</text><text x="62" y="398" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#16202A" text-anchor="start">— This adapter’s artifacts hash-match what was anchored.</text><text x="62" y="424" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#16202A" text-anchor="start">— This dataset is retrievable at exactly this root hash.</text><text x="62" y="450" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#16202A" text-anchor="start">— This provider’s TEE signer is acknowledged on-chain.</text><text x="62" y="476" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#16202A" text-anchor="start">— 0G’s own integrity check passed on delivery.</text><rect x="847.5" y="340" width="792.5" height="180" rx="8" fill="#FDF1F1" stroke="#B3272D" stroke-opacity="0.5"/><text x="869.5" y="370" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B3272D" text-anchor="start" letter-spacing="1.1">WHAT IT DOES NOT PROVE</text><text x="869.5" y="400" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#16202A" text-anchor="start">That the provider actually ran the epochs it claimed.</text><text x="869.5" y="428" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5C6B7A" text-anchor="start">Proving that needs zero-knowledge proofs over the training computation itself</text><text x="869.5" y="447" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5C6B7A" text-anchor="start">— PEFT-restricted update circuits enforcing optimizer semantics, as in arXiv</text><text x="869.5" y="466" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5C6B7A" text-anchor="start">2510.16830. That is a research programme, not a sixteen-day build. It is on</text><text x="40" y="594" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#8A98A6" text-anchor="start">Crucible proves lineage, not honest training. Every document in this repository says so in the same words.</text>
</svg>