<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="640" viewBox="0 0 1680 640" role="img">
<rect width="1680" height="640" fill="#FCFDFE"/>
<text x="40" y="46" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#16202A" text-anchor="start" letter-spacing="0.8">THE TASK LIFECYCLE — AND THE TWO WAYS IT ENDS BADLY</text><text x="40" y="70" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5C6B7A" text-anchor="start">0G's own states, mirrored exactly. Crucible invents no progress bar.</text><rect x="40" y="130" width="46.4" height="52" rx="6" fill="#FFFFFF" stroke="#E3E9EE" stroke-width="1"/><text x="63.2" y="162" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202A" text-anchor="middle">Init</text><line x1="86.4" y1="156" x2="106.4" y2="156" stroke="#8A98A6" stroke-width="1.4"/><path d="M 112.4 156 L 104.4 152 L 104.4 160 Z" fill="#8A98A6"/><rect x="112.4" y="130" width="89.39999999999999" height="52" rx="6" fill="#FFFFFF" stroke="#E3E9EE" stroke-width="1"/><text x="157.1" y="162" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202A" text-anchor="middle">SettingUp</text><line x1="201.8" y1="156" x2="221.8" y2="156" stroke="#8A98A6" stroke-width="1.4"/><path d="M 227.8 156 L 219.8 152 L 219.8 160 Z" fill="#8A98A6"/><rect x="227.8" y="130" width="55" height="52" rx="6" fill="#FFFFFF" stroke="#E3E9EE" stroke-width="1"/><text x="255.3" y="162" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202A" text-anchor="middle">SetUp</text><line x1="282.8" y1="156" x2="302.8" y2="156" stroke="#8A98A6" stroke-width="1.4"/><path d="M 308.8 156 L 300.8 152 L 300.8 160 Z" fill="#8A98A6"/><rect x="308.8" y="130" width="80.8" height="52" rx="6" fill="#FFFFFF" stroke="#E3E9EE" stroke-width="1"/><text x="349.2" y="162" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202A" text-anchor="middle">Training</text><line x1="389.6" y1="156" x2="409.6" y2="156" stroke="#8A98A6" stroke-width="1.4"/><path d="M 415.6 156 L 407.6 152 L 407.6 160 Z" fill="#8A98A6"/><rect x="415.6" y="130" width="72.19999999999999" height="52" rx="6" fill="#FFFFFF" stroke="#E3E9EE" stroke-width="1"/><text x="451.70000000000005" y="162" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202A" text-anchor="middle">Trained</text><line x1="487.8" y1="156" x2="507.8" y2="156" stroke="#8A98A6" stroke-width="1.4"/><path d="M 513.8 156 L 505.8 152 L 505.8 160 Z" fill="#8A98A6"/><rect x="513.8" y="130" width="98" height="52" rx="6" fill="#FFFFFF" stroke="#E3E9EE" stroke-width="1"/><text x="562.8" y="162" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202A" text-anchor="middle">Delivering</text><line x1="611.8" y1="156" x2="631.8" y2="156" stroke="#8A98A6" stroke-width="1.4"/><path d="M 637.8 156 L 629.8 152 L 629.8 160 Z" fill="#8A98A6"/><rect x="637.8" y="130" width="89.39999999999999" height="52" rx="6" fill="#FDF1F1" stroke="#B3272D" stroke-width="1.8"/><text x="682.5" y="162" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" fill="#B3272D" text-anchor="middle">Delivered</text><line x1="727.1999999999999" y1="156" x2="747.1999999999999" y2="156" stroke="#8A98A6" stroke-width="1.4"/><path d="M 753.1999999999999 156 L 745.1999999999999 152 L 745.1999999999999 160 Z" fill="#8A98A6"/><rect x="753.1999999999999" y="130" width="149.6" height="52" rx="6" fill="#FFFFFF" stroke="#E3E9EE" stroke-width="1"/><text x="827.9999999999999" y="162" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" fill="#16202A" text-anchor="middle">UserAcknowledged</text><line x1="902.8" y1="156" x2="922.8" y2="156" stroke="#8A98A6" stroke-width="1.4"/><path d="M 928.8 156 L 920.8 152 L 920.8 160 Z" fill="#8A98A6"/><rect x="928.8" y="130" width="80.8" height="52" rx="6" fill="#F1F8F4" stroke="#7FB79A" stroke-width="1"/><text x="969.1999999999999" y="162" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" fill="#16202A" text-anchor="middle">Finished</text><text x="1023.5999999999999" y="162" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#8A98A6" text-anchor="start">· Failed</text><line x1="682.5" y1="182" x2="682.5" y2="222" stroke="#B3272D" stroke-width="1.6" stroke-dasharray="5 4"/><text x="682.5" y="244" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#B3272D" text-anchor="middle" letter-spacing="0.8">48-HOUR CLOCK STARTS HERE</text><text x="682.5" y="264" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B7A" text-anchor="middle">No email. No dashboard. No warning of any kind.</text><rect x="40" y="330" width="520" height="190" rx="8" fill="#FDF1F1" stroke="#B3272D" stroke-opacity="0.5"/><text x="62" y="360" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B3272D" text-anchor="start" letter-spacing="1.1">IF THE CLOCK RUNS OUT</text><rect x="62" y="374" width="476" height="56" rx="5" fill="#FFFFFF" stroke="#E3E9EE"/><text x="75" y="399" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#16202A" text-anchor="start">The model is gone</text><text x="75" y="419" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B7A" text-anchor="start">and 30% of the fee is deducted. The task is over.</text><rect x="62" y="442" width="476" height="56" rx="5" fill="#FFFFFF" stroke="#E3E9EE"/><text x="75" y="467" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#16202A" text-anchor="start">Nothing told you</text><text x="75" y="487" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B7A" text-anchor="start">you were expected to poll a CLI until you noticed.</text><rect x="584" y="330" width="520" height="190" rx="8" fill="#FDF1F1" stroke="#B3272D" stroke-opacity="0.5"/><text x="606" y="360" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#B3272D" text-anchor="start" letter-spacing="1.1">IF YOU TAKE THE LEGACY PATH</text><rect x="606" y="374" width="476" height="56" rx="5" fill="#FFFFFF" stroke="#E3E9EE"/><text x="619" y="399" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#16202A" text-anchor="start">The queue locks permanently</text><text x="619" y="419" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B7A" text-anchor="start">every later addDeliverable reverts: previous deliverable not acknowledged.</text><rect x="606" y="442" width="476" height="56" rx="5" fill="#FFFFFF" stroke="#E3E9EE"/><text x="619" y="467" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#16202A" text-anchor="start">Documented in a TSDoc comment</text><text x="619" y="487" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B7A" text-anchor="start">reported by a hackathon user in May 2026. Nowhere else.</text><rect x="1128" y="330" width="512" height="190" rx="8" fill="#F1F8F4" stroke="#7FB79A"/><text x="1150" y="360" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#3F7A5E" text-anchor="start" letter-spacing="1.1">WHAT CRUCIBLE DOES INSTEAD</text><rect x="1150" y="374" width="468" height="56" rx="5" fill="#FFFFFF" stroke="#E3E9EE"/><text x="1163" y="399" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#16202A" text-anchor="start">Acknowledges on arrival</text><text x="1163" y="419" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B7A" text-anchor="start">the daemon acts as soon as Delivered lands, not at the buzzer.</text><rect x="1150" y="442" width="468" height="56" rx="5" fill="#FFFFFF" stroke="#E3E9EE"/><text x="1163" y="467" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#16202A" text-anchor="start">Cannot reach the locked state</text><text x="1163" y="487" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B7A" text-anchor="start">a test asserts the deprecated path is never called. Unreachable, not merely</text><text x="1163" y="502" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B7A" text-anchor="start">avoided.</text><text x="40" y="610" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#8A98A6" text-anchor="start">Crucible hit this itself on its first real run: the delivered model failed to download on Windows — the bundled 0g-storage-client is a Linux binary — and the TEE fallback returned HTTP 429. The retry loop is the product.</text>
</svg>